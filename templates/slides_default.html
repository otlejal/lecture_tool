<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Презентация</title>
<style>
  /* ===== Основы: слайд всегда ровно в один экран, без прокрутки ===== */
  * { box-sizing: border-box; }

  body[data-theme="editorial"] {
    --bg: #f6f1e7; --ink: #1c1a16; --muted: #6d6555; --accent: #b4442c; --panel: #ece3d2;
    --accent-soft: rgba(180, 68, 44, .14);
    --font-display: Georgia, "Times New Roman", serif;
    --font-body: "Segoe UI", Arial, sans-serif;
  }
  body[data-theme="midnight"] {
    --bg: #070b10; --ink: #e9f2f5; --muted: #93a8b3; --accent: #4ff0c6; --panel: #111a23;
    --accent-soft: rgba(79, 240, 198, .14);
    --font-display: "Segoe UI", Arial, sans-serif;
    --font-body: "Segoe UI", Arial, sans-serif;
  }
  body[data-theme="nordic"] {
    --bg: #f1f5f8; --ink: #16222e; --muted: #5f7486; --accent: #2f6f9f; --panel: #e2eaf0;
    --accent-soft: rgba(47, 111, 159, .14);
    --font-display: "Segoe UI", Arial, sans-serif;
    --font-body: "Segoe UI", Arial, sans-serif;
  }
  body[data-theme="bold"] {
    --bg: #0d0d0d; --ink: #f5f5ee; --muted: #a3a39a; --accent: #d7ff3e; --panel: #1b1b18;
    --accent-soft: rgba(215, 255, 62, .16);
    --font-display: "Arial Black", "Segoe UI", Arial, sans-serif;
    --font-body: "Segoe UI", Arial, sans-serif;
  }
  body[data-theme="academic"] {
    --bg: #fbfcfe; --ink: #1d2733; --muted: #5b6b7c; --accent: #3b6ea8; --panel: #eaf1f9;
    --accent-soft: rgba(59, 110, 168, .14);
    --font-display: "Segoe UI", Arial, sans-serif;
    --font-body: "Segoe UI", Arial, sans-serif;
  }

  html, body { margin: 0; height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
  }

  .deck { position: relative; height: 100vh; height: 100dvh; }

  .slide {
    position: absolute;
    inset: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    align-items: center;
    padding: clamp(1.4rem, 5vw, 5rem);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .45s ease, transform .45s ease;
    transform: translateY(10px);
    --fit: 1;
  }

  /* Если модель прислала плотный слайд, JS включает эти классы и текст чуть уменьшается */
  .slide.compact-1 { --fit: .94; }
  .slide.compact-2 { --fit: .87; }
  .slide.compact-3 { --fit: .8; }

  .slide::-webkit-scrollbar { display: none; }

  /* Мягкое пятно акцента — атмосфера без картинок */
  .slide::after {
    content: "";
    position: absolute;
    right: -12%;
    bottom: -38%;
    width: min(58vw, 720px);
    height: min(58vw, 720px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--accent-soft), transparent 68%);
    pointer-events: none;
  }

  .slide.active { opacity: 1; visibility: visible; pointer-events: auto; transform: none; }

  .slide-inner { position: relative; z-index: 1; width: 100%; max-width: 1080px; margin: 0 auto; }

  /* ===== Типографика: всё масштабируется, поэтому влезает на любом экране ===== */
  h1, h2, h3, p, ul, ol, blockquote, figure, pre { margin: 0; }

  .slide h1, .slide .h1 {
    font-family: var(--font-display);
    font-size: clamp(1.9rem, calc(min(6.2vw, 9vh) * var(--fit)), 5rem);
    line-height: 1.04;
    letter-spacing: -.02em;
    text-wrap: balance;
  }

  .slide h2, .slide .h2 {
    font-family: var(--font-display);
    font-size: clamp(1.5rem, calc(min(4.2vw, 6.4vh) * var(--fit)), 3.2rem);
    line-height: 1.1;
    letter-spacing: -.01em;
    text-wrap: balance;
  }

  .lead {
    color: var(--muted);
    font-size: clamp(.95rem, calc(min(1.6vw, 2.6vh) * var(--fit)), 1.45rem);
    line-height: 1.45;
    margin-top: clamp(.5rem, 1.6vh, 1rem);
    max-width: 46ch;
  }

  .kicker {
    color: var(--accent);
    font-size: clamp(.7rem, 1.1vw, .95rem);
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    margin-bottom: clamp(.5rem, 1.6vh, 1rem);
  }

  /* Пункты: крупно, с воздухом, не больше шести */
  .points {
    list-style: none;
    padding: 0;
    margin-top: clamp(.9rem, 2.6vh, 2rem);
    display: grid;
    gap: clamp(.45rem, 1.7vh, 1.1rem);
  }

  .points li {
    position: relative;
    padding-left: clamp(1.5rem, 2.6vw, 2.2rem);
    font-size: clamp(1rem, calc(min(2.1vw, 3.4vh) * var(--fit)), 1.85rem);
    line-height: 1.32;
  }

  .points li::before {
    content: "";
    position: absolute;
    left: 0;
    top: .52em;
    width: clamp(.55rem, 1vw, .85rem);
    height: clamp(.55rem, 1vw, .85rem);
    border-radius: 3px;
    background: var(--accent);
  }

  /* ===== Раскладки ===== */
  .slide[data-layout="title"] .slide-inner { text-align: left; }
  .slide[data-layout="title"] .title-rule {
    width: clamp(3rem, 8vw, 7rem);
    height: clamp(3px, .6vh, 6px);
    background: var(--accent);
    margin-bottom: clamp(1rem, 3vh, 2rem);
  }

  .slide[data-layout="section"] { background: var(--accent); }
  .slide[data-layout="section"] .slide-inner { max-width: 900px; }
  .slide[data-layout="section"] .slide-inner * { color: var(--bg); }
  .slide[data-layout="section"] .lead { opacity: .72; }
  .slide[data-layout="section"]::after { display: none; }

  .statement {
    font-family: var(--font-display);
    font-size: clamp(1.6rem, calc(min(5vw, 7.6vh) * var(--fit)), 4.2rem);
    line-height: 1.08;
    letter-spacing: -.02em;
    text-wrap: balance;
    max-width: 18ch;
  }

  blockquote {
    font-family: var(--font-display);
    font-size: clamp(1.3rem, calc(min(3.6vw, 5.4vh) * var(--fit)), 3rem);
    line-height: 1.18;
    padding-left: clamp(1rem, 2.4vw, 2rem);
    border-left: clamp(3px, .6vw, 7px) solid var(--accent);
    max-width: 32ch;
  }

  blockquote cite {
    display: block;
    margin-top: clamp(.8rem, 2vh, 1.4rem);
    font-family: var(--font-body);
    font-size: clamp(.8rem, 1.3vw, 1.05rem);
    font-style: normal;
    color: var(--muted);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr));
    gap: clamp(.7rem, 2vw, 1.6rem);
    margin-top: clamp(1rem, 3vh, 2.2rem);
  }

  .stat {
    background: var(--panel);
    border-radius: 14px;
    padding: clamp(.9rem, 2.4vw, 1.8rem);
    min-height: clamp(6rem, 20vh, 11rem);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: .4rem;
  }

  .stat b {
    font-family: var(--font-display);
    color: var(--accent);
    font-size: clamp(1.7rem, calc(min(4.6vw, 7vh) * var(--fit)), 3.6rem);
    line-height: 1;
    letter-spacing: -.02em;
  }

  .stat span { color: var(--muted); font-size: clamp(.8rem, 1.3vw, 1.05rem); line-height: 1.3; }

  .compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(1rem, 3vw, 2.4rem);
    margin-top: clamp(1rem, 3vh, 2rem);
  }

  .compare > div {
    border-top: clamp(3px, .5vh, 5px) solid var(--accent);
    padding-top: clamp(.6rem, 1.6vh, 1rem);
  }

  .compare h3 {
    font-size: clamp(.9rem, 1.6vw, 1.25rem);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .6rem;
  }

  .compare ul { list-style: none; padding: 0; display: grid; gap: .45rem; }
  .compare li { font-size: clamp(.9rem, calc(min(1.7vw, 2.8vh) * var(--fit)), 1.4rem); line-height: 1.32; }

  pre {
    margin-top: clamp(.9rem, 2.4vh, 1.6rem);
    padding: clamp(.8rem, 2vw, 1.4rem);
    background: var(--panel);
    border-left: clamp(3px, .5vw, 5px) solid var(--accent);
    border-radius: 8px;
    overflow: hidden;
    white-space: pre-wrap;
    word-break: break-word;
  }

  code, pre {
    font-family: Consolas, "Courier New", monospace;
    font-size: clamp(.8rem, calc(min(1.5vw, 2.4vh) * var(--fit)), 1.15rem);
    line-height: 1.5;
  }

  /* ===== Появление элементов: короткое, с уважением к reduced-motion ===== */
  .slide.active .reveal { animation: rise .55s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms + 80ms); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }

  /* ===== Интерфейс показа ===== */
  .chrome { position: fixed; z-index: 5; pointer-events: none; }

  .progress { left: 0; right: 0; bottom: 0; height: 4px; background: var(--accent-soft); }
  .progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }

  .counter {
    right: clamp(.8rem, 2vw, 1.6rem);
    bottom: clamp(.8rem, 2vh, 1.4rem);
    font-size: .8rem;
    letter-spacing: .1em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .hint {
    left: clamp(.8rem, 2vw, 1.6rem);
    bottom: clamp(.8rem, 2vh, 1.4rem);
    font-size: .75rem;
    color: var(--muted);
    opacity: .85;
  }

  .notes {
    left: 0; right: 0; bottom: 0;
    max-height: 42vh;
    overflow: auto;
    background: rgba(10, 12, 16, .92);
    color: #f2f5f8;
    padding: 1rem 1.4rem 1.6rem;
    font-size: .95rem;
    line-height: 1.5;
    display: none;
  }

  body.show-notes .notes { display: block; }
  body.show-notes .hint, body.show-notes .counter { opacity: 0; }
  .notes b { display: block; font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin-bottom: .35rem; }
  .notes:empty { display: none; }

  @media (max-width: 700px) {
    .hint { display: none; }
    .compare { grid-template-columns: 1fr; gap: .8rem; }
    .stats { grid-template-columns: 1fr 1fr; }
  }

  @media (max-height: 480px) {
    .lead, .stat span { display: none; }
    .points { margin-top: .6rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .slide, .progress span { transition: none; }
    .slide.active .reveal { animation: none; }
  }

  @media print {
    body { overflow: visible; }
    .deck { height: auto; }
    .slide {
      position: relative;
      height: 100vh;
      opacity: 1;
      visibility: visible;
      break-after: page;
      page-break-after: always;
    }
    .chrome, .notes { display: none !important; }
  }
</style>
</head>
<body>
<div id="deck" class="deck" role="region" aria-label="Презентация" aria-live="polite"></div>

<div class="chrome progress" aria-hidden="true"><span id="progress"></span></div>
<div class="chrome counter" id="counter" aria-hidden="true">1 / 1</div>
<div class="chrome hint" id="hint">← → или пробел — листать, S — заметки, F — во весь экран</div>
<aside class="notes" id="notes" aria-hidden="true"></aside>

<script id="data" type="application/json">{{DATA}}</script>
<script>
  const deckData = JSON.parse(document.getElementById("data").textContent);
  const stage = document.getElementById("deck");
  const progressBar = document.getElementById("progress");
  const counter = document.getElementById("counter");
  const hint = document.getElementById("hint");
  const notesBox = document.getElementById("notes");
  const slides = deckData.slides || [];

  document.title = deckData.title || "Презентация";
  document.body.dataset.theme = deckData.theme || "editorial";

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  // Число элементов на слайде ограничено промптом, поэтому рисуем без обрезки и прокрутки
  function buildSlide(slide, index) {
    const root = el("section", "slide");
    root.dataset.layout = slide.layout || "bullets";
    root.setAttribute("aria-label", slide.heading || `Слайд ${index + 1}`);
    const inner = el("div", "slide-inner");
    root.append(inner);

    let order = 0;
    const add = (node, className) => {
      if (className) node.classList.add(className);
      node.classList.add("reveal");
      node.style.setProperty("--i", order++);
      inner.append(node);
      return node;
    };

    const heading = slide.heading || deckData.title || "";
    const subheading = slide.subheading || "";

    switch (slide.layout) {
      case "title": {
        add(el("div", "title-rule"));
        add(el("h1", null, heading));
        const subtitle = subheading || deckData.subtitle || "";
        if (subtitle) add(el("p", "lead", subtitle));
        break;
      }
      case "section": {
        add(el("div", "kicker", "Раздел"));
        add(el("h1", null, heading));
        if (subheading) add(el("p", "lead", subheading));
        break;
      }
      case "statement": {
        add(el("p", "statement", heading));
        if (subheading) add(el("p", "lead", subheading));
        break;
      }
      case "quote": {
        const quote = el("blockquote");
        quote.append(document.createTextNode("«" + (slide.quote || heading) + "»"));
        if (slide.author) quote.append(el("cite", null, "— " + slide.author));
        add(quote);
        break;
      }
      case "stats": {
        if (heading) add(el("h2", null, heading));
        if (subheading) add(el("p", "lead", subheading));
        const grid = el("div", "stats");
        for (const stat of slide.stats || []) {
          const card = el("figure", "stat");
          card.append(el("b", null, stat.value), el("span", null, stat.label || ""));
          grid.append(card);
        }
        add(grid);
        break;
      }
      case "compare": {
        if (heading) add(el("h2", null, heading));
        if (subheading) add(el("p", "lead", subheading));
        const grid = el("div", "compare");
        for (const column of slide.columns || []) {
          const box = el("div");
          if (column.heading) box.append(el("h3", null, column.heading));
          const list = el("ul");
          for (const point of column.points || []) list.append(el("li", null, point));
          box.append(list);
          grid.append(box);
        }
        add(grid);
        break;
      }
      case "code": {
        if (heading) add(el("h2", null, heading));
        if (subheading) add(el("p", "lead", subheading));
        const pre = el("pre");
        pre.append(el("code", null, slide.code || ""));
        add(pre);
        break;
      }
      default: {
        if (heading) add(el("h2", null, heading));
        if (subheading) add(el("p", "lead", subheading));
        const list = el("ul", "points");
        for (const point of slide.bullets || []) list.append(el("li", null, point));
        add(list);
      }
    }

    // Заметки выступающего храним на самом слайде, показываем по клавише S
    root.dataset.notes = slide.notes || "";
    return root;
  }

  slides.forEach((slide, index) => stage.append(buildSlide(slide, index)));

  const slideNodes = [...stage.querySelectorAll(".slide")];
  let current = 0;

  function clampIndex(index) {
    return Math.max(0, Math.min(slideNodes.length - 1, index));
  }

  function show(index) {
    current = clampIndex(index);
    slideNodes.forEach((node, i) => node.classList.toggle("active", i === current));
    const total = slideNodes.length || 1;
    counter.textContent = `${current + 1} / ${total}`;
    progressBar.style.width = `${((current + 1) / total) * 100}%`;
    const note = slideNodes[current]?.dataset.notes || "";
    notesBox.innerHTML = "";
    if (note) {
      notesBox.append(el("b", null, "Заметки"), document.createTextNode(note));
    }
  }

  function next() { show(current + 1); }
  function prev() { show(current - 1); }

  // Подгонка под экран: если текста слишком много, слегка уменьшаем шрифт (не больше трёх шагов)
  function fitSlide(slideEl) {
    const inner = slideEl.querySelector(".slide-inner");
    if (!inner) return;
    slideEl.classList.remove("compact-1", "compact-2", "compact-3");
    const style = getComputedStyle(slideEl);
    const available = slideEl.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
    let height = inner.getBoundingClientRect().height;
    for (const level of [1, 2, 3]) {
      if (height <= available + 1) break;
      slideEl.classList.add("compact-" + level);
      const smaller = inner.getBoundingClientRect().height;
      // Если шрифт уже на нижней границе читаемости, дальнейшее уменьшение не поможет
      if (smaller >= height - 1) {
        slideEl.classList.remove("compact-" + level);
        break;
      }
      height = smaller;
    }
  }

  slideNodes.forEach(fitSlide);
  window.addEventListener("resize", () => requestAnimationFrame(() => slideNodes.forEach(fitSlide)));

  if (slideNodes.length) {
    const fromHash = Number(location.hash.replace("#", ""));
    show(Number.isInteger(fromHash) && fromHash > 0 ? fromHash - 1 : 0);
  }

  // Клавиатура: стрелки, пробел, PageUp/PageDown (пульты-кликеры шлют именно их), Home/End
  document.addEventListener("keydown", (event) => {
    const key = event.key;
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(key)) {
      event.preventDefault();
      next();
    } else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(key)) {
      event.preventDefault();
      prev();
    } else if (key === "Home") {
      show(0);
    } else if (key === "End") {
      show(slideNodes.length - 1);
    } else if (key === "s" || key === "S" || key === "ы" || key === "Ы") {
      document.body.classList.toggle("show-notes");
    } else if (key === "f" || key === "F" || key === "а" || key === "А") {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else document.documentElement.requestFullscreen?.().catch(() => {});
    }
  });

  // Колесо мыши: один слайд за жест, с короткой блокировкой от «прокрутки пачкой»
  let wheelLockedUntil = 0;
  window.addEventListener("wheel", (event) => {
    const now = Date.now();
    if (now < wheelLockedUntil || Math.abs(event.deltaY) < 12) return;
    wheelLockedUntil = now + 550;
    event.deltaY > 0 ? next() : prev();
  }, { passive: true });

  // Свайпы на тач-экранах
  let touchStart = null;
  window.addEventListener("touchstart", (event) => {
    const point = event.changedTouches[0];
    touchStart = { x: point.clientX, y: point.clientY };
  }, { passive: true });

  window.addEventListener("touchend", (event) => {
    if (!touchStart) return;
    const point = event.changedTouches[0];
    const dx = point.clientX - touchStart.x;
    const dy = point.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) dx < 0 ? next() : prev();
    else if (Math.abs(dy) > 55 && Math.abs(dy) > Math.abs(dx)) dy < 0 ? next() : prev();
  }, { passive: true });

  // Подсказка исчезает после первого листания
  const hideHint = () => { hint.style.transition = "opacity .6s"; hint.style.opacity = "0"; };
  window.addEventListener("keydown", hideHint, { once: true });
  window.addEventListener("click", hideHint, { once: true });
</script>
</body>
</html>
